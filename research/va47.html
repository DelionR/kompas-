J1L21lZGlhL29yaWdpbmFsLzYyNTBjNjJjZDIwOGQ2YTg1N2MyNTllZjY0OGZjZTNkZTcxOGNiM2FiZDdkMjczZDQ4MmM4ZWY2NzNiNTI5ZDkucG5n.jpg","ext":".jpg","width":400},{"url":"https://cdn-02.iek.ru/imgproxy/tp5cbxiDz9U0t6Tjt69mBsO774oI4Vg_anl9MinU6UE/q:100/rs:fit:800/aHR0cHM6Ly9jZG4tMDEuaWVrLnJ1L21lZGlhL29yaWdpbmFsLzYyNTBjNjJjZDIwOGQ2YTg1N2MyNTllZjY0OGZjZTNkZTcxOGNiM2FiZDdkMjczZDQ4MmM4ZWY2NzNiNTI5ZDkucG5n.jpg","ext":".jpg","width":800}],"description":"Устройства дифференциальной защиты KARAT представлены выключателями дифференциальными ВД (УЗО), автоматическими выключателями дифференциального тока АД, автоматическими выключателями дифференциального тока АВДТ.\nВыключатели дифференциальные ВД (УЗО) предназначены для защиты человека от поражения электрическим током при случайном непреднамеренном прикосновении к токоведущим частям электроустановок и предотвращает возникновение пожаров вследствие протекания токов утечки на землю. Не имеет собственного потребления электроэнергии и обладает высокой механической износостойкостью.\nАвтоматические выключатели дифференциального тока АД – это быстродействующие защитные выключатели обеспечивают:\n– в исполнениях с уставками срабатывания 10, 30 и 100 мА – защиту людей от поражения электрическим током при прямом непреднамеренном прикосновении к токоведущим частям электрооборудования;\n– в исполнении с уставкой срабатывания 300 мА – защиту от пожара из-за возгорания изоляции токоведущих частей; – защиту от перегрузки и короткого замыкания; – защиту от недопустимого повышения напряжения сети (АД12М).\nВ изделиях предусмотрена индикация срабатывания от дифференциального тока, а для АД12М также светодиодная индикация включенного состояния. АД12М сохраняет работоспособность при снижении напряжения электрической сети до 50 В. В качестве коммутационных аппаратов в изделиях использованы выключатели автоматические ВА47-29 новой серии.\nАвтоматические выключатели дифференциального тока АВДТ предназначены для защиты человека от поражения электрическим током при повреждении изоляции электроустановок, для предотвращения пожаров вследствие протекания токов утечки на землю и для защиты от перегрузки и короткого замыкания. Рекомендуются для защиты групповых линий, питающих розетки наружной установки, розеток и освещения подвалов и гаражей.","seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/","configurators":[],"children":[{"name":"Выключатели дифференциальные ВД (УЗО)","nameOrig":"01.04.02.01 Выключатели дифференциальные ВД (УЗО)","slug":"vyklyuchateli_differentsialnye_vd_uzo","imageUrl":null,"imageVariants":[],"description":null,"seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/vyklyuchateli_differentsialnye_vd_uzo/","configurators":[],"children":null},{"name":"Автоматические выключатели дифференциального тока АД","nameOrig":"01.04.02.02 Автоматические выключатели дифференциального тока АД","slug":"avtomaticheskie_vyklyuchateli_differentsialnogo_toka_ad","imageUrl":null,"imageVariants":[],"description":null,"seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/avtomaticheskie_vyklyuchateli_differentsialnogo_toka_ad/","configurators":[],"children":null},{"name":"Автоматические выключатели дифференциального тока АВДТ","nameOrig":"01.04.02.03 Автоматические выключатели дифференциального тока АВДТ","slug":"avtomaticheskie_vyklyuchateli_differentsialnogo_toka_avdt","imageUrl":null,"imageVariants":[],"description":null,"seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/avtomaticheskie_vyklyuchateli_differentsialnogo_toka_avdt/","configurators":[],"children":null}]},{"name":"Дополнительные устройства KARAT","nameOrig":"01.04.03 Дополнительные устройства KARAT","slug":"dopolnitelnye_ustroystva_kara 0OGZjZTNkZTcxOGNiM2FiZDdkMjczZDQ4MmM4ZWY2NzNiNTI5ZDkucG5n.jpg","ext":".jpg","width":800}],"description":"Устройства дифференциальной защиты KARAT представлены выключателями дифференциальными ВД (УЗО), автоматическими выключателями дифференциального тока АД, автоматическими выключателями дифференциального тока АВДТ.\nВыключатели дифференциальные ВД (УЗО) предназначены для защиты человека от поражения электрическим током при случайном непреднамеренном прикосновении к токоведущим частям электроустановок и предотвращает возникновение пожаров вследствие протекания токов утечки на землю. Не имеет собственного потребления электроэнергии и обладает высокой механической износостойкостью.\nАвтоматические выключатели дифференциального тока АД – это быстродействующие защитные выключатели обеспечивают:\n– в исполнениях с уставками срабатывания 10, 30 и 100 мА – защиту людей от поражения электрическим током при прямом непреднамеренном прикосновении к токоведущим частям электрооборудования;\n– в исполнении с уставкой срабатывания 300 мА – защиту от пожара из-за возгорания изоляции токоведущих частей; – защиту от перегрузки и короткого замыкания; – защиту от недопустимого повышения напряжения сети (АД12М).\nВ изделиях предусмотрена индикация срабатывания от дифференциального тока, а для АД12М также светодиодная индикация включенного состояния. АД12М сохраняет работоспособность при снижении напряжения электрической сети до 50 В. В качестве коммутационных аппаратов в изделиях использованы выключатели автоматические ВА47-29 новой серии.\nАвтоматические выключатели дифференциального тока АВДТ предназначены для защиты человека от поражения электрическим током при повреждении изоляции электроустановок, для предотвращения пожаров вследствие протекания токов утечки на землю и для защиты от перегрузки и короткого замыкания. Рекомендуются для защиты групповых линий, питающих розетки наружной установки, розеток и освещения подвалов и гаражей.","seoText":null,"seoTextGroup":null,"url":"/moduln
