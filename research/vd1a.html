 электрическим током при случайном непреднамеренном прикосновении к токоведущим частям электроустановок и предотвращает возникновение пожаров вследствие протекания токов утечки на землю. Не имеет собственного потребления электроэнергии и обладает высокой механической износостойкостью.\nАвтоматические выключатели дифференциального тока АД – это быстродействующие защитные выключатели обеспечивают:\n– в исполнениях с уставками срабатывания 10, 30 и 100 мА – защиту людей от поражения электрическим током при прямом непреднамеренном прикосновении к токоведущим частям электрооборудования;\n– в исполнении с уставкой срабатывания 300 мА – защиту от пожара из-за возгорания изоляции токоведущих частей; – защиту от перегрузки и короткого замыкания; – защиту от недопустимого повышения напряжения сети (АД12М).\nВ изделиях предусмотрена индикация срабатывания от дифференциального тока, а для АД12М также светодиодная индикация включенного состояния. АД12М сохраняет работоспособность при снижении напряжения электрической сети до 50 В. В качестве коммутационных аппаратов в изделиях использованы выключатели автоматические ВА47-29 новой серии.\nАвтоматические выключатели дифференциального тока АВДТ предназначены для защиты человека от поражения электрическим током при повреждении изоляции электроустановок, для предотвращения пожаров вследствие протекания токов утечки на землю и для защиты от перегрузки и короткого замыкания. Рекомендуются для защиты групповых линий, питающих розетки наружной установки, розеток и освещения подвалов и гаражей.","seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/","configurators":[],"children":[{"name":"Выключатели дифференциальные ВД (УЗО)","nameOrig":"01.04.02.01 Выключатели дифференциальные ВД (УЗО)","slug":"vyklyuchateli_differentsialnye_vd_uzo","imageUrl":null,"imageVariants":[],"description":null,"seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modu зделиях использованы выключатели автоматические ВА47-29 новой серии.\nАвтоматические выключатели дифференциального тока АВДТ предназначены для защиты человека от поражения электрическим током при повреждении изоляции электроустановок, для предотвращения пожаров вследствие протекания токов утечки на землю и для защиты от перегрузки и короткого замыкания. Рекомендуются для защиты групповых линий, питающих розетки наружной установки, розеток и освещения подвалов и гаражей.","seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/","configurators":[],"children":[{"name":"Выключатели дифференциальные ВД (УЗО)","nameOrig":"01.04.02.01 Выключатели дифференциальные ВД (УЗО)","slug":"vyklyuchateli_differentsialnye_vd_uzo","imageUrl":null,"imageVariants":[],"description":null,"seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/vyklyuchateli_differentsialnye_vd_uzo/","configurators":[],"children":[{"name":"Выключатели дифференциальные ВД1-63 (УЗО) тип AC","nameOrig":"01.04.02.01.01 Выключатели дифференциальные ВД1-63 (УЗО) тип AC","slug":"vyklyuchateli_differentsialnye_vd1_63_uzo_tip_ac","imageUrl":null,"imageVariants":[],"description":null,"seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/vyklyuchateli_differentsialnye_vd_uzo/vyklyuchateli_differentsialnye_vd1_63_uzo_tip_ac/","configurators":[],"children":[]},{"name":"Выключатели дифференциальные ВД1-63S (УЗО) тип AC селективное","nameOrig":"01.04.02.01.02 Выключатели дифференциальные ВД1-63S (УЗО) тип AC селективное","slug":"vyklyuchateli_differentsialnye_vd1_63s_uzo_tip_ac_selektivnoe","imageUrl":null,"imageVariants":[],"description":null,"seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/vy е выключатели обеспечивают:\n– в исполнениях с уставками срабатывания 10, 30 и 100 мА – защиту людей от поражения электрическим током при прямом непреднамеренном прикосновении к токоведущим частям электрооборудования;\n– в исполнении с уставкой срабатывания 300 мА – защиту от пожара из-за возгорания изоляции токоведущих частей; – защиту от перегрузки и короткого замыкания; – защиту от недопустимого повышения напряжения сети (АД12М).\nВ изделиях предусмотрена индикация срабатывания от дифференциального тока, а для АД12М также светодиодная индикация включенного состояния. АД12М сохраняет работоспособность при снижении напряжения электрической сети до 50 В. В качестве коммутационных аппаратов в изделиях использованы выключатели автоматические ВА47-29 новой серии.\nАвтоматические выключатели дифференциального тока АВДТ предназначены для защиты человека от поражения электрическим током при повреждении изоляции электроустановок, для предотвращения пожаров вследствие протекания токов утечки на землю и для защиты от перегрузки и короткого замыкания. Рекомендуются для защиты групповых линий, питающих розетки наружной установки, розеток и освещения подвалов и гаражей.","seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/","configurators":[],"children":[{"name":"Выключатели дифференциальные ВД (УЗО)","nameOrig":"01.04.02.01 Выключатели дифференциальные ВД (УЗО)","slug":"vyklyuchateli_differentsialnye_vd_uzo","imageUrl":null,"imageVariants":[],"description":null,"seoText":null,"seoTextGroup":null,"url":"/modulnoe_oborudovanie/modulnoe_oborudovanie_karat/ustroystva_differentsialnoy_zashchity_karat/vyklyuchateli_differentsialnye_vd_uzo/","configurators":[],"children":[{"name":"Выключатели дифференциальные ВД1-63 (УЗО) тип AC","nameOrig":"01.04.02.01.01 Выключатели дифференциальные ВД1-63 (УЗО) тип AC","slug":"vyklyuchateli_differentsialnye_vd1_63_uzo_tip_ac","imageUrl":null,"imageVariants":[],"de
