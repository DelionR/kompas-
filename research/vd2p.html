25°С до +40°С.\nНасечки на контактных зажимах снижают тепловые потери и увеличивают механическую прочность соединения.\nЭргономичная кнопка ТЕСТ для проверки работоспособности устройства и правильности подключения.\nНагрузку можно подключать как к верхним, так и к нижним зажимам.\nШирокий диапазон рабочих напряжений устройства эксплуатационного контроля (от 110 до 265В в 2-х полюсном исполнении, и от 200 до 460В в 4-х полюсном контактном исполнении).\nГлавные контакты 4-х полюсного дифференциального выключателя ВД1-63 тип А сконструированы так, что нейтральный контакт замыкается раньше и отключается позже, что позволяет избежать перекоса фаз напряжения нагрузки, аналогично \"обрыву нуля\" в сети.\nБыстрый монтаж с помощью защелки с двойным фиксированным положением.","certificates":[{"type":"Отказное письмо 123-ФЗ","pubName":"Весь ассортимент (ОР ВНИИПО). Отказное письмо ФЗ-123. ИЭК ХОЛДИНГ","nameOrig":"303эп-14-2-7 от 29.12.2025 отказное ВНИИПО_123-ФЗ_30.12.2026.pdf","number":"303эп-14-2-7 от 29.12.2025","issuer":"ФГБУ ВНИИПО МЧС России","dateStart":"2025-12-29T00:00:00.000Z","dateEnd":"2026-12-30T00:00:00.000Z","size":13181820,"file":"fc8ed5352302c626e90a63ed3c63250293bd1795af98f9e807cf3724f2ee7772.pdf","url":"https://cdn-01.iek.ru/media/original/fc8ed5352302c626e90a63ed3c63250293bd1795af98f9e807cf3724f2ee7772.pdf"},{"type":"Сертификат 004, 020","pubName":"ВД1-63, ВД3-63 без серии и серии KARAT товарного знака IEK. LEGEND","nameOrig":"ВД1-63, ВД3-63 без серии и серии KARAT_IEK_LEGEND_004 020_2030_ПАО.pdf","number":"ЕАЭС RU С-CN.АЯ46.В.49490/26","issuer":"РОСТЕСТ","dateStart":"2026-06-30T00:00:00.000Z","dateEnd":"2030-07-08T00:00:00.000Z","size":2913880,"file":"66471e7ef387979ac5abf7fa6cca326f44d776ed8a6d2de5f0e0673c5ca4bdb3.pdf","url":"https://cdn-01.iek.ru/media/original/66471e7ef387979ac5abf7fa6cca326f44d776ed8a6d2de5f0e0673c5ca4bdb3.pdf"},{"type":"Отказное письмо 043","pubName":"Весь ассортимент (ОР ВНИИПО). Отказное письмо ТР ЕАЭС 043. ИЭК ХОЛДИНГ","nameOrig":"
